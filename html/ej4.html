<!-- Ejemplo 4: Listas, Tablas y Divisiones -->
<!-- Usa listas para menú, tabla para datos y divs con clases e IDs -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas, Tablas y Divs</title>
    <style>
        .menu {
            background-color: #eee;
            padding: 10px;
        }
        .tabla-precios {
            border-collapse: collapse;
            width: 50%;
        }
        .tabla-precios th, .tabla-precios td {
            border: 1px solid #333;
            padding: 8px;
        }
        #info {
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Ejemplo de listas, tablas y divisiones</h1>

    <!-- Lista para menú -->
    <div class="menu">
        <h2>Menú del Restaurante</h2>
        <ul>
            <li>Ensalada César</li>
            <li>Pizza Margarita</li>
            <li>Pasta Carbonara</li>
        </ul>
    </div>

    <br>

    <!-- Tabla de precios -->
    <table class="tabla-precios">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Café</td>
                <td>$2.00</td>
            </tr>
            <tr>
                <td>Jugo de naranja</td>
                <td>$3.00</td>
            </tr>
        </tbody>
    </table>

    <!-- Div con ID -->
    <div id="info">
        <p>Los precios incluyen impuestos.</p>
    </div>

</body>

</html>
