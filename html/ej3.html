<!-- Ejemplo 3: Hipervínculos, Rutas e Imágenes -->
<!-- Muestra enlaces internos y externos, imágenes locales y desde URL, y un favicon -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces e Imágenes</title>
    <link rel="icon" href="elementos/favicon.png" type="image/x-icon"> <!-- Favicon -->
</head>

<body>

    <h1>Ejemplo de hipervínculos e imágenes</h1>

    <!-- Enlace externo -->
    <a href="https://www.google.com" target="_blank">Ir a Google</a><br>

    <!-- Enlace interno -->
    <a href="#seccion2">Ir a la sección 2</a>
        <!-- Contenido para hacer scroll visible -->
        <div style="height: 400px;"></div>
    <h2 id="seccion2">Sección 2</h2>

    <!-- Imagen local (asegúrate que exista en la carpeta) -->
    <img src="elementos/FOTO.png" alt="Imagen local" width="200">

    <!-- Imagen desde URL -->
    <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Imagen desde URL" width="200">

</body>

</html>
