<!-- Ejemplo 7: Gráficos y Canvas -->
<!--
Este ejemplo muestra el uso de gráficos SVG y del elemento Canvas:
Se muestran formas como círculo, estrella, elipse con degradado y texto.
También se usa JavaScript para dibujar un rectángulo en el canvas.
-->


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ejemplo 7: SVG y Canvas</title>
</head>
<body>
  <h1>Ejemplos de Graficos y Canvas</h1>

  <h2>Círculo SVG</h2>
  <svg width="100" height="100">
    <!-- Círculo rojo -->
    <circle cx="50" cy="50" r="40" stroke="black" stroke-width="2" fill="red" />
  </svg>

  <h2>Estrella SVG</h2>
  <svg width="300" height="200">
    <polygon points="100,10 40,198 190,78 10,78 160,198"
    style="fill:lime;stroke:purple;stroke-width:5;fill-rule:evenodd;" />
  </svg>

  <h2>Elipse y texto de degradado SVG</h2>
  <svg height="130" width="500">
    <defs>
    <linearGradient id="grad1">
      <stop offset="0%" stop-color="yellow" />
      <stop offset="100%" stop-color="red" />
    </linearGradient>
    </defs>
    <ellipse cx="100" cy="70" rx="85" ry="55" fill="url(#grad1)" />
    <text fill="#ffffff" font-size="45" font-family="Verdana" x="50" y="86">SVG</text>
    Sorry, your browser does not support inline SVG.
  </svg>


  <h2>Dibujo Canvas</h2>
  <canvas id="miCanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>

  <script>
    // Dibuja un rectángulo azul en canvas
    const canvas = document.getElementById('miCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'blue';
    ctx.fillRect(20, 20, 150, 50);
  </script>
</body>
</html>
