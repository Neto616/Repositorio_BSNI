<!-- Ejemplo 8: APIs Web HTML5 -->
<!--
Este ejemplo muestra el uso de varias APIs web:

1. Geolocalización: muestra la latitud y longitud del usuario con un botón.
2. Almacenamiento local: permite guardar un texto y lo muestra al recargar la página.
3. Drag and Drop: arrastra una imagen y suéltala en un contenedor.

Se usan funciones de JavaScript nativas del navegador sin librerías externas.
-->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ejemplo 8: APIs Web</title>
  <style>
    #div1, #div2 {
      width: 200px;
      height: 150px;
      margin: 10px;
      padding: 10px;
      border: 1px solid black;
      display: inline-block;
      vertical-align: top;
    }
    img {
      width: 50px;
      cursor: move;
    }
  </style>
</head>
<body>
  <h2>Geolocalización</h2>
  <button onclick="obtenerUbicacion()">Mostrar mi ubicación</button>
  <p id="ubicacion"></p>

  <h2>Almacenamiento Local</h2>
  <input type="text" id="dato" placeholder="Escribe algo" />
  <button onclick="guardarDato()">Guardar</button>
  <p id="datoGuardado"></p>

  <h2>Drag and Drop</h2>
  <div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)">
    <p>Arrastra la imagen aquí:</p>
  </div>
  <div id="div2">
    <img src="https://www.w3schools.com/images/w3schools_green.jpg" draggable="true" ondragstart="drag(event)" id="drag1" alt="Imagen" />
  </div>

  <script>
    // Geolocalización
    function obtenerUbicacion() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById('ubicacion').textContent = 
            `Latitud: ${pos.coords.latitude}, Longitud: ${pos.coords.longitude}`;
        });
      } else {
        alert('Geolocalización no soportada');
      }
    }

    // Almacenamiento Local
    function guardarDato() {
      const valor = document.getElementById('dato').value;
      localStorage.setItem('miDato', valor);
      document.getElementById('datoGuardado').textContent = `Dato guardado: ${valor}`;
    }
    // Mostrar dato guardado al cargar la página
    window.onload = () => {
      const dato = localStorage.getItem('miDato');
      if (dato) {
        document.getElementById('datoGuardado').textContent = `Dato guardado: ${dato}`;
      }
    };

    // Drag and Drop
    function allowDrop(ev) {
      ev.preventDefault();
    }
    function drag(ev) {
      ev.dataTransfer.setData("text", ev.target.id);
    }
    function drop(ev) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData("text");
      ev.target.appendChild(document.getElementById(data));
    }
  </script>
</body>
</html>
