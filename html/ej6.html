<!-- Ejemplo 6: Formularios Interactivos -->
<!--
Este ejemplo muestra dos formularios:

1. Formulario de contacto con nombre, correo, mensaje y selección de auto.
2. Formulario para calcular una suma con un slider y un número.
El resultado se muestra con la etiqueta <output> y se actualiza automáticamente.
-->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de Contacto y Comentarios</title>
  <style>
    .cuerpo {
      font-family: sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    form {
      margin-bottom: 30px;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input, textarea, select, output {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    output {
      display: block;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Ejemplos de Formularios interactivos</h1>

  <div class="cuerpo">
  <h2>Formulario de Contacto</h2>

  <form action="#" method="post">
    <div class="campo">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
    </div>

    <div class="campo">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="tu@email.com" required>
    </div>

    <div class="campo">
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí" required></textarea>
    </div>

    <div class="campo">
      <label for="cars">Elige un auto:</label>
      <select id="cars" name="cars">
        <option value="volvo">Volvo</option>
        <option value="fiat">Fiat</option>
        <option value="audi">Audi</option>
      </select>
    </div>

    <input type="submit" value="Enviar">
  </form>

  <hr>

  <h2>Formulario de Comentario con Cálculo</h2>
  <p>Completa el siguiente formulario para realizar una suma interactiva:</p>

  <form oninput="resultado.value = parseInt(a.value) + parseInt(b.value)">
    <div class="campo">
      <label for="a">Selecciona un número (deslizable):</label>
      <input type="range" id="a" name="a" value="50" min="0" max="100">
    </div>

    <div class="campo">
      <label for="b">Ingresa otro número:</label>
      <input type="number" id="b" name="b" value="50">
    </div>

    <div class="campo">
      <label>Resultado:</label>
      <output name="resultado" for="a b">100</output>
    </div>
  </form>
  </div>
</body>
</html>
