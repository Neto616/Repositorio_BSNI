<!-- Ejemplo 5: Multimedia: Video, Audio e Iframes -->
<!-- Inserta video local, audio y contenido externo con iframe -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multimedia en HTML</title>
</head>

<body>

    <h1>Ejemplo de video, audio e iframe</h1>

    <!-- Video local -->
    <video width="320" height="240" controls>
        <source src="elementos/video.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <br>

    <!-- Audio local -->
    <audio controls>
        <source src="elementos/audio.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
    </audio>

    <br>

    <!-- Video de YouTube embebido -->
   <iframe width="560" height="315" src="https://www.youtube.com/embed/jfKfPfyJRdk" 
    frameborder="5" allowfullscreen> </iframe>

    <br>

    <!-- Página externa con iframe -->
    <iframe src="https://es.wikipedia.org/wiki/React" width="600" height="300" 
    title="Sitio externo"></iframe>

</body>

</html>
