<!-- Ejemplo 2: Texto, Estilos y Colores -->
<!-- Muestra el uso de estilos en texto, incluyendo negrita, 
    cursiva, colores y clases CSS. -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos y Colores en HTML</title>
    <style>
        /* Estilo para la clase .resaltado */
        .resaltado {
            color: darkblue;
            font-weight: bold;
        }
        /* Estilo para el párrafo centrado */
        .centrado {
            text-align: center;
            color: green;
        }
    </style>
</head>

<body>

    <h1>Ejemplo de estilos en texto</h1>

    <p>Este texto está en <b>negrita</b> y este otro en <i>cursiva</i>.</p>

    <p class="resaltado">Este texto usa una clase para cambiar color y peso.</p>

    <p class="centrado">Este párrafo está centrado y en verde.</p>

    <p style="color: red;">Este texto usa estilo inline para ponerlo en rojo.</p>

</body>

</html>
