<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Flexbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Mi Portafolio</h1>
      <p>Diseñado con Flexbox</p>
    </header>

    <!-- Contenedor principal de proyectos -->
    <section class="contenedor-proyectos">
      <article class="proyecto">
        <img src="img1.png" alt="Proyecto 1">
        <h2>Proyecto Uno</h2>
        <p>Tarjeta con estilos.</p>
      </article>
      <article class="proyecto">
        <img src="img2.png" alt="Proyecto 2">
        <h2>Proyecto Dos</h2>
        <p>Formulario Moderno.</p>
      </article>
      <article class="proyecto">
        <img src="img3.png" alt="Proyecto 3">
        <h2>Proyecto Tres</h2>
        <p>Tablas y contradores.</p>
      </article>
    </section>
  </main>
</body>
</html>
